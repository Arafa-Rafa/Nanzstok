<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOKNANZ - Platform Generator & Management Stok Akun</title>

    <!-- ========================================== -->
    <!-- 1. LIBRARY EKSTERNAL (CDN)                 -->
    <!-- ========================================== -->
    <!-- Tailwind CSS Engine CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon Suite CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- ========================================== -->
    <!-- 2. CSS STYLES & TAILWIND CONFIGURATION     -->
    <!-- ========================================== -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        cyanbrand: {
                            50: '#ecfeff',
                            100: '#cffafe',
                            300: '#67e8f9',
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                            700: '#0e7490',
                            900: '#164e63',
                        },
                        emeraldbrand: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
        }
        /* Custom Scrollbar Stylings */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
        }

        /* Utility Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyanbrand-500 selection:text-white relative antialiased pb-20 sm:pb-0">

    <!-- Hidden Input File for Database Restore -->
    <input type="file" id="importBackupFile" accept=".json" class="hidden" onchange="handleRestoreDatabase(event)">

    <!-- ========================================== -->
    <!-- 3. HTML5 STRUCTURE                         -->
    <!-- ========================================== -->

    <!-- Login Screen Overlay -->
    <div id="loginOverlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute -top-16 -right-16 w-36 h-36 bg-cyanbrand-500/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-emeraldbrand-500/10 rounded-full blur-3xl"></div>
            
            <div class="text-center mb-6 relative">
                <div class="w-16 h-16 bg-gradient-to-tr from-cyanbrand-600 via-teal-500 to-emeraldbrand-500 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-cyanbrand-500/20">
                    <i class="fa-solid fa-bolt text-3xl text-white"></i>
                </div>
                <h2 class="text-3xl font-black bg-gradient-to-r from-cyanbrand-400 via-teal-300 to-emeraldbrand-400 bg-clip-text text-transparent tracking-wide">STOKNANZ</h2>
                <p class="text-xs text-slate-400 mt-1">Sistem Batch Generator & Management Stok Akun</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" method="POST" class="space-y-4 relative">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="loginUsername" name="username" autocomplete="username" required placeholder="Masukkan username" class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-cyanbrand-500 focus:ring-1 focus:ring-cyanbrand-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required placeholder="Masukkan password" class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-cyanbrand-500 focus:ring-1 focus:ring-cyanbrand-500 transition">
                    </div>
                </div>

                <div id="loginError" class="hidden text-red-400 text-xs bg-red-500/10 border border-red-500/20 rounded-xl p-3 text-center flex items-center justify-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Username atau password salah!</span>
                </div>

                <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyanbrand-600 to-teal-500 hover:from-cyanbrand-500 hover:to-teal-400 text-white font-bold rounded-xl text-sm shadow-lg shadow-cyanbrand-600/20 transition duration-200">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk Sekarang
                </button>
            </form>
        </div>
    </div>

    <!-- Header Navigation Bar -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5 flex items-center justify-between gap-2">
            <!-- Logo Section (Fixed Visibility) -->
            <div class="flex items-center space-x-2.5 shrink-0">
                <div class="p-2 sm:p-2.5 bg-gradient-to-tr from-cyanbrand-600 to-teal-500 rounded-xl shadow-md shadow-cyanbrand-600/20 shrink-0">
                    <i class="fa-solid fa-bolt text-lg sm:text-xl text-white"></i>
                </div>
                <div class="shrink-0">
                    <h1 class="text-xl sm:text-2xl font-black bg-gradient-to-r from-cyanbrand-400 via-teal-300 to-emeraldbrand-400 bg-clip-text text-transparent whitespace-nowrap tracking-wide">
                        STOKNANZ
                    </h1>
                    <p class="text-[10px] text-slate-400 hidden sm:block whitespace-nowrap">Batch Generator & Stock Manager</p>
                </div>
            </div>

            <!-- Header Controls -->
            <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                <!-- Generator Modal Button -->
                <button onclick="openGeneratorModal()" class="bg-gradient-to-r from-cyanbrand-600 to-teal-600 hover:from-cyanbrand-500 hover:to-teal-500 text-white font-bold px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm flex items-center space-x-1.5 transition shadow-lg shadow-cyanbrand-600/20 whitespace-nowrap">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span class="hidden sm:inline">⚡ Generator Massal</span>
                    <span class="sm:hidden text-[11px]">⚡ Generator</span>
                </button>

                <!-- User Management Button (Owner Only) -->
                <button id="btnManageUsers" onclick="openUserModal()" title="Kelola Pengguna" class="hidden bg-purple-600/90 hover:bg-purple-500 text-white font-medium p-2 sm:px-3 sm:py-2 rounded-xl text-xs sm:text-sm flex items-center space-x-1.5 transition shadow-md shrink-0">
                    <i class="fa-solid fa-users-gear"></i>
                    <span class="hidden lg:inline">Pengguna</span>
                </button>

                <!-- Backup & Restore Buttons -->
                <button onclick="exportUserDatabase()" title="Backup Database ke File JSON" class="hidden sm:flex bg-slate-800 hover:bg-slate-700 text-emeraldbrand-400 border border-slate-700 font-medium p-2 sm:px-3 sm:py-2 rounded-xl text-xs sm:text-sm items-center space-x-1.5 transition">
                    <i class="fa-solid fa-download"></i>
                    <span class="hidden xl:inline">Backup</span>
                </button>

                <button onclick="document.getElementById('importBackupFile').click()" title="Restore / Import Database" class="hidden sm:flex bg-slate-800 hover:bg-slate-700 text-cyanbrand-400 border border-slate-700 font-medium p-2 sm:px-3 sm:py-2 rounded-xl text-xs sm:text-sm items-center space-x-1.5 transition">
                    <i class="fa-solid fa-file-import"></i>
                    <span class="hidden xl:inline">Restore</span>
                </button>

                <button id="btnAddAccount" onclick="openModal('add')" title="Tambah Akun Manual" class="hidden sm:flex bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium p-2 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm items-center space-x-1.5 transition">
                    <i class="fa-solid fa-plus text-cyanbrand-400"></i>
                    <span class="hidden lg:inline">Tambah</span>
                </button>

                <button onclick="openLogsModal()" title="Logs Aktivitas" class="hidden md:flex bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 p-2 sm:px-3 sm:py-2 rounded-xl text-xs sm:text-sm items-center space-x-2 transition">
                    <i class="fa-solid fa-clock-rotate-left text-amber-400"></i>
                    <span class="hidden md:inline">Logs</span>
                </button>

                <button onclick="openTrashModal()" title="Folder Sampah" class="hidden md:flex bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 p-2 sm:px-3 sm:py-2 rounded-xl text-xs sm:text-sm items-center space-x-2 transition relative">
                    <i class="fa-solid fa-trash-can text-red-400"></i>
                    <span class="hidden md:inline">Sampah</span>
                    <span id="trashBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>

                <!-- User Profile & Logout -->
                <div class="pl-1.5 sm:pl-2 border-l border-slate-800 flex items-center space-x-2 shrink-0">
                    <div class="text-right hidden md:block">
                        <div id="headerUserName" class="text-xs font-semibold text-slate-200">User</div>
                        <div id="headerUserRole" class="text-[10px] text-cyanbrand-400 font-mono">Role</div>
                    </div>
                    <button onclick="handleLogout()" title="Keluar / Logout" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 p-2 rounded-xl text-xs sm:text-sm transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 flex-grow w-full box-border">
        
        <!-- Activity Log Widget Banner -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 sm:p-4 mb-4 sm:mb-6 shadow-md flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
            <div class="flex items-center space-x-3 min-w-0 w-full md:w-auto">
                <div class="p-2 sm:p-2.5 bg-cyanbrand-500/10 text-cyanbrand-400 rounded-xl border border-cyanbrand-500/20 shrink-0">
                    <i class="fa-solid fa-list-check text-base sm:text-lg"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <h3 class="text-xs sm:text-sm font-bold text-slate-200">Logs Aktivitas Penggunaan Mandiri</h3>
                    <p id="latestLogText" class="text-[11px] sm:text-xs text-slate-400 truncate">Belum ada aktivitas tercatat hari ini.</p>
                </div>
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto">
                <button onclick="exportUserDatabase()" class="flex-1 md:flex-initial text-center text-xs bg-emeraldbrand-500/10 hover:bg-emeraldbrand-500/20 text-emeraldbrand-400 border border-emeraldbrand-500/30 px-3 py-1.5 rounded-xl transition font-medium shrink-0 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-download"></i> Backup Data
                </button>
                <button onclick="openLogsModal()" class="flex-1 md:flex-initial text-center text-xs bg-slate-800 hover:bg-slate-700 text-cyanbrand-400 border border-slate-700 px-3 py-1.5 rounded-xl transition font-medium shrink-0">
                    Lihat Logs <i class="fa-solid fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- Stat Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-3.5 mb-4 sm:mb-6">
            <div onclick="setFilterFolder('READY')" class="cursor-pointer glass-card border border-slate-800 rounded-2xl p-3 sm:p-4 flex items-center justify-between shadow-sm hover:border-emeraldbrand-500/40 transition">
                <div>
                    <p class="text-[10px] sm:text-[11px] font-semibold text-emeraldbrand-400 uppercase tracking-wider">Akun Ready</p>
                    <h3 id="statReady" class="text-xl sm:text-2xl font-black text-emeraldbrand-400 mt-0.5 sm:mt-1">0</h3>
                </div>
                <div class="p-2.5 sm:p-3 bg-emeraldbrand-500/10 text-emeraldbrand-400 rounded-xl">
                    <i class="fa-solid fa-circle-check text-lg sm:text-xl"></i>
                </div>
            </div>

            <div onclick="setFilterFolder('CD_15')" class="cursor-pointer glass-card border border-slate-800 rounded-2xl p-3 sm:p-4 flex items-center justify-between shadow-sm hover:border-amber-500/40 transition">
                <div>
                    <p class="text-[10px] sm:text-[11px] font-semibold text-amber-400 uppercase tracking-wider">Tidur 15 Hari</p>
                    <h3 id="statCD15" class="text-xl sm:text-2xl font-bold text-amber-400 mt-0.5 sm:mt-1">0</h3>
                </div>
                <div class="p-2.5 sm:p-3 bg-amber-500/10 text-amber-400 rounded-xl">
                    <i class="fa-solid fa-moon text-lg sm:text-xl"></i>
                </div>
            </div>

            <div onclick="setFilterFolder('CD_30')" class="cursor-pointer glass-card border border-slate-800 rounded-2xl p-3 sm:p-4 flex items-center justify-between shadow-sm hover:border-indigo-500/40 transition">
                <div>
                    <p class="text-[10px] sm:text-[11px] font-semibold text-indigo-400 uppercase tracking-wider">Tidur 30 Hari</p>
                    <h3 id="statCD30" class="text-xl sm:text-2xl font-bold text-indigo-400 mt-0.5 sm:mt-1">0</h3>
                </div>
                <div class="p-2.5 sm:p-3 bg-indigo-5
